name: Mezgeb Android upgrade and offline gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build baseline and candidate with the same CI debug identity
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/mezgeb-baseline" 864e1f1e8e15369ac157dec86fba4ca46a4372e5
          gradle --no-daemon --project-dir "$RUNNER_TEMP/mezgeb-baseline/android" :app:assembleDebug
          cp "$RUNNER_TEMP/mezgeb-baseline/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/mezgeb-baseline.apk"
          gradle --no-daemon --project-dir android :app:assembleDebug :app:assembleDebugAndroidTest
          TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert(){ "$TOOL" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          old=$(cert "$RUNNER_TEMP/mezgeb-baseline.apk")
          new=$(cert android/app/build/outputs/apk/debug/app-debug.apk)
          test -n "$old" && test "$old" = "$new"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-upgrade-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezgeb-upgrade-diagnostics-api-${{ matrix.api }}
          path: upgrade-diagnostics/
          if-no-files-found: ignore
