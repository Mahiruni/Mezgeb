name: Mezgeb Android full release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build bundled release variant
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle --no-daemon --project-dir android :app:assembleRelease
      - name: Verify full release package
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          python - "$APK" <<'PY'
          import zipfile,json,sys
          with zipfile.ZipFile(sys.argv[1]) as apk:
              required=['assets/mezgeb-ui/index.html','assets/mezgeb-ui/app.js','assets/mezgeb-ui/app.css','assets/mezgeb-ui/build.json']
              assert all(p in apk.namelist() for p in required), 'Incomplete app bundle'
              assert any('noto-sans-ethiopic' in p for p in apk.namelist()), 'Ethiopic font missing'
              assert any('plus-jakarta-sans' in p for p in apk.namelist()), 'Latin font missing'
              metadata=json.loads(apk.read(required[-1]))
              assert metadata['version']=='1.0.3', 'Unexpected interface version'
              assert metadata['origin']=='https://mezgeb-omega.vercel.app', 'Ledger origin changed'
              assert metadata['cloudConfigured'], 'Verified public cloud config missing'
              print('Full bundled UI and public cloud configuration verified')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='10' versionName='1.0.3'"
      - name: Sign using the owner-held Mezgeb release key
        id: sign
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MEZGEB_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MEZGEB_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEZGEB_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEZGEB_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.MEZGEB_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$EXPECTED_CERT" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production signing is not configured. Uploading unsigned release candidate only; not installable."
            exit 0
          fi
          umask 077
          KEY="$RUNNER_TEMP/mezgeb-release.jks"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEY"
          mkdir -p release
          TOOL="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOL/zipalign" -f -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOL/apksigner" sign --ks "$KEY" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/Mezgeb-1.0.3.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOL/apksigner" verify --verbose --print-certs release/Mezgeb-1.0.3.apk | tee "$RUNNER_TEMP/verify.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/verify.txt" | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "${#EXPECTED}" -eq 64
          test "$ACTUAL" = "$EXPECTED"
          (cd release && sha256sum Mezgeb-1.0.3.apk > SHA256SUMS.txt)
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: mezgeb-1.0.3-production-signed
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed != 'true'
        with:
          name: mezgeb-1.0.3-unsigned-release-candidate
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
