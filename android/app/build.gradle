plugins {
    id 'com.android.application'
}
android {
    namespace 'com.hisabtechnologies.mezgeb'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hisabtechnologies.mezgeb'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.0.1'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def uiRoot = rootProject.projectDir.parentFile
def uiOutput = file("$buildDir/generated/mezgebUi/assets")
tasks.register("bundleMezgebUi", Exec) {
    workingDir uiRoot
    commandLine "npm", "run", "build:android-ui"
    inputs.dir(new File(uiRoot,"src"))
    inputs.file(new File(uiRoot,"scripts/build-android-ui.mjs"))
    inputs.file(new File(uiRoot,"package.json"))
    outputs.dir(uiOutput)
}
tasks.register("installMezgebUiDependencies", Exec) {
    workingDir uiRoot
    commandLine "npm", "install", "--no-audit", "--no-fund"
}
tasks.named("bundleMezgebUi").configure { dependsOn("installMezgebUiDependencies") }
android.sourceSets.main.assets.srcDir(uiOutput)
tasks.named("preBuild").configure { dependsOn("bundleMezgebUi") }

 dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
